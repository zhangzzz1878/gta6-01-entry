<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0f14;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #1b2a4a;
    image-rendering: auto;
    cursor: crosshair;
  }
  #minimap {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 208px;
    height: 156px;
    border: 2px solid rgba(255, 255, 255, 0.65);
    border-radius: 6px;
    background: rgba(10, 16, 12, 0.85);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    z-index: 5;
  }
  #hint {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    letter-spacing: 0.04em;
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <canvas id="minimap" width="208" height="156"></canvas>
    <div id="hint">SOLMAR BAY &middot; an original open-world crime game &middot; no network needed</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
